<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة تهنئة عيد الفطر</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { position: relative; width: 100%; max-width: 400px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #card-to-export { position: relative; width: 100%; line-height: 0; }
        .bg-image { width: 100%; height: auto; display: block; }
        
        /* إحداثيات النصوص فوق البطاقة */
        .text-overlay { position: absolute; width: 100%; text-align: center; color: #d4af37; font-weight: bold; font-size: 1.2rem; pointer-events: none; }
        #display-to { top: 57.5%; left: 0; } /* مكان اسم المستلم */
        #display-from { top: 67%; left: 0; } /* مكان اسم المرسل */

        .controls { margin-top: 20px; width: 100%; max-width: 400px; background: #2a2a2a; padding: 20px; border-radius: 10px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #444; border-radius: 5px; background: #333; color: white; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 12px; background: #d4af37; border: none; border-radius: 5px; color: #1a1a1a; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background: #b8962d; }
    </style>
</head>
<body>

    <h2>صمم بطاقتك الخاصة</h2>

    <div class="container">
        <div id="card-to-export">
            <img src="card.jpg" alt="بطاقة العيد" class="bg-image">
            <div id="display-to" class="text-overlay"></div>
            <div id="display-from" class="text-overlay"></div>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="input-to" placeholder="اسم المستلم (إلى)" oninput="updateText()">
        <input type="text" id="input-from" placeholder="اسمك/عائلتك (من)" oninput="updateText()">
        <button onclick="downloadCard()">تحميل البطاقة</button>
    </div>

    <script>
        function updateText() {
            document.getElementById('display-to').innerText = document.getElementById('input-to').value;
            document.getElementById('display-from').innerText = document.getElementById('input-from').value;
        }

        function downloadCard() {
            const btn = document.querySelector('button');
            btn.innerText = "جاري المعالجة...";
            
            html2canvas(document.querySelector("#card-to-export"), {
                useCORS: true,
                scale: 3 // جودة عالية
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Eid-Greeting.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                btn.innerText = "تحميل البطاقة";
            });
        }
    </script>
</body>
</html>
