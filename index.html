<button id="downloadBtn" class="btn-download" onclick="downloadCard()">تحميل البطاقة ✅</button>
        <div class="back-link" onclick="location.reload()">↩️ تعديل الأسماء</div>
    </div>

    <script>
        function updateText() {
            document.getElementById('display-to').innerText = document.getElementById('input-to').value;
            document.getElementById('display-from').innerText = document.getElementById('input-from').value;
        }

        function showPayment() {
            if(!document.getElementById('input-to').value || !document.getElementById('input-from').value) {
                alert("يرجى كتابة الأسماء"); return;
            }
            document.getElementById('step-1').style.display = 'none';
            document.getElementById('step-2').style.display = 'block';
        }

        function toggleDownloadBtn() {
            document.getElementById('downloadBtn').style.display = document.getElementById('paidCheck').checked ? 'block' : 'none';
        }

        function downloadCard() {
            const btn = document.getElementById('downloadBtn');
            btn.innerText = "جاري الحفظ...";
            
            // إضافة خاصية تضمن قراءة الصور من نفس النطاق (GitHub)
            html2canvas(document.getElementById("card-to-export"), {
                useCORS: true,
                allowTaint: true,
                scale: 2
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Eid-Card-HS.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
                btn.innerText = "تم التحميل!";
            }).catch(err => {
                console.log(err);
                alert("يرجى التأكد من رفع صورة card.jpg في GitHub");
            });
        }
    </script>
</body>
</html>
