<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSforDesign | بطاقات العيد</title>
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { position: relative; width: 100%; max-width: 400px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #ce9e48; margin-bottom: 20px; }
        #card-to-export { position: relative; width: 100%; line-height: 0; }
        .bg-image { width: 100%; height: auto; display: block; }
        
        .text-overlay { 
            position: absolute; width: 100%; text-align: center; pointer-events: none; transition: all 0.3s;
            font-family: 'Amiri', serif; font-weight: bold;
        }
        
        .selector-area { width: 100%; max-width: 400px; display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .thumb { width: 100px; text-align: center; border-radius: 8px; border: 2px solid #444; cursor: pointer; background: #2a2a2a; transition: 0.3s; }
        .thumb.active { border-color: #ce9e48; transform: scale(1.05); }
        .thumb img { width: 100%; height: 60px; object-fit: cover; border-radius: 5px 5px 0 0; }

        .panel { width: 100%; max-width: 400px; background: #2a2a2a; padding: 25px; border-radius: 15px; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #444; border-radius: 5px; background: #333; color: white; text-align: center; font-size: 1rem; outline: none; }
        
        .btn-primary { background: #ce9e48; color: #1a1a1a; width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        #payment-section { display: none; margin-top: 20px; border-top: 2px dashed #444; padding-top: 20px; text-align: center; }
        .qr-code { width: 180px; height: auto; margin: 15px auto; display: block; border-radius: 10px; border: 3px solid #ce9e48; background: white; padding: 5px; }
        .iban-style { background: #111; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; color: #ce9e48; display: block; margin: 10px 0; word-break: break-all; }
        
        .btn-download { background: #28a745; color: white; display: none; margin-top: 15px; width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .checkbox-container { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.95rem; margin: 20px 0; color: #ddd; }
    </style>
</head>
<body>

    <h2 style="color: #ce9e48; font-family: 'Amiri', serif; margin-bottom: 10px;">HSforDesign</h2>

    <div class="selector-area">
        <div class="thumb active" onclick="changeCard('eid-garden.jpg', 36, 42, '#5d6d4e', false, this)">
            <img src="eid-garden.jpg">
            <p style="font-size: 0.75rem; color: #ddd; margin: 5px 0;">تصميم 1</p>
        </div>
        <div class="thumb" onclick="changeCard('card.jpg', 58, 65, '#ce9e48', true, this)">
            <img src="card.jpg">
            <p style="font-size: 0.75rem; color: #ddd; margin: 5px 0;">تصميم 2</p>
        </div>
    </div>

    <div class="container">
        <div id="card-to-export">
            <img id="main-card-img" src="eid-garden.jpg" alt="بطاقة العيد" class="bg-image">
            <div id="display-to" class="text-overlay" style="top: 36%; font-size: 1.8rem; right: 0; left: 0;"></div>
            <div id="display-from" class="text-overlay" style="top: 42%; font-size: 1.4rem; right: 0; left: 0;"></div>
        </div>
    </div>

    <div class="panel">
        <div id="inputs-area">
            <input type="text" id="input-to" placeholder="إلى: (اسم المستلم)" oninput="updateText()">
            <input type="text" id="input-from" placeholder="من: (اسمك أو عائلتك)" oninput="updateText()">
            <button type="button" class="btn-primary" onclick="revealPayment()">الاستمرار للدفع</button>
        </div>

        <div id="payment-section">
            <h3 style="color: #ce9e48;">إتمام الطلب</h3>
            <img src="rajhi-qr.jpg" alt="كود الراجحي" class="qr-code">
            <span class="iban-style">SA83 8000 0866 6080 1163 4427</span>
            <p style="font-weight: bold; color: #ce9e48;">المستفيد: حنان العمار</p>

            <label class="checkbox-container">
                <input type="checkbox" id="paidCheck" onchange="toggleDownloadBtn()"> أكدت عملية التحويل بنجاح
            </label>

            <button id="downloadBtn" class="btn-download" onclick="startProcess()">إرسال الإيصال وتحميل البطاقة 🚀</button>
        </div>
    </div>

    <script>
        let showFromLabel = false; // التحكم في إظهار كلمة "من"

        function changeCard(imgSrc, topTo, topFrom, textColor, needFrom, element) {
            document.getElementById('main-card-img').src = imgSrc;
            const toTxt = document.getElementById('display-to');
            const fromTxt = document.getElementById('display-from');
            
            toTxt.style.top = topTo + "%";
            fromTxt.style.top = topFrom + "%";
            toTxt.style.color = textColor;
            fromTxt.style.color = textColor;
            
            showFromLabel = needFrom;
            updateText(); // تحديث النص فوراً عند تغيير البطاقة

            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
        }

        function updateText() {
            const fromValue = document.getElementById('input-from').value;
            document.getElementById('display-to').innerText = document.getElementById('input-to').value;
            
            // إضافة كلمة "من: " فقط إذا كان التصميم يتطلب ذلك والقيمة ليست فارغة
            if (showFromLabel && fromValue !== "") {
                document.getElementById('display-from').innerText = "من: " + fromValue;
            } else {
                document.getElementById('display-from').innerText = fromValue;
            }
        }

        function revealPayment() {
            if(document.getElementById('input-to').value === "" || document.getElementById('input-from').value === "") {
                alert("لطفاً اكتب الأسماء أولاً"); return;
            }
            document.getElementById('payment-section').style.display = 'block';
            document.getElementById('inputs-area').style.display = 'none';
        }

        function toggleDownloadBtn() {
            document.getElementById('downloadBtn').style.display = document.getElementById('paidCheck').checked ? 'block' : 'none';
        }

        function startProcess() {
            alert("سيتم نقلك للبوت لإرسال الإيصال. يرجى العودة فوراً للتحميل.");
            window.open(`https://t.me/HSfordesign_bot`, '_blank');
            
            let btn = document.getElementById('downloadBtn');
            btn.disabled = true;
            let sec = 5; 
            
            let timer = setInterval(() => {
                sec--;
                btn.innerText = `جاري التحميل تلقائياً خلال ${sec} ثانية...`;
                if(sec <= 0) {
                    clearInterval(timer);
                    html2canvas(document.querySelector("#card-to-export"), {useCORS: true, scale: 3}).then(canvas => {
                        let link = document.createElement('a');
                        link.download = 'HS-Eid-Card.jpg';
                        link.href = canvas.toDataURL("image/jpeg");
                        link.click();
                        btn.innerText = "تم الحفظ بنجاح ✅";
                        btn.disabled = false;
                    });
                }
            }, 1000);
        }
    </script>
</body>
</html>
