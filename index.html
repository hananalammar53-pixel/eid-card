<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSforDesign | متجر البطاقات</title>
    
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { position: relative; width: 100%; max-width: 400px; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 2px solid #ce9e48; margin-bottom: 20px; }
        #card-to-export { position: relative; width: 100%; line-height: 0; }
        .bg-image { width: 100%; height: auto; display: block; }
        
        /* العلامة المائية السوداء للحماية */
        .watermark {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-30deg);
            font-size: 3.5rem; color: rgba(0, 0, 0, 0.4); font-weight: 900; pointer-events: none;
            white-space: nowrap; z-index: 10; font-family: sans-serif; text-transform: uppercase;
        }

        .text-overlay { position: absolute; width: 100%; text-align: center; pointer-events: none; font-family: 'Amiri', serif; font-weight: bold; display: none; }
        .selector-area { width: 100%; max-width: 400px; display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; }
        .thumb { width: 100px; text-align: center; border-radius: 8px; border: 2px solid #444; cursor: pointer; background: #2a2a2a; transition: 0.3s; }
        .thumb.active { border-color: #ce9e48; transform: scale(1.05); }
        .thumb img { width: 100%; height: 60px; object-fit: cover; border-radius: 5px 5px 0 0; }
        
        .panel { width: 100%; max-width: 400px; background: #2a2a2a; padding: 25px; border-radius: 15px; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #444; border-radius: 5px; background: #333; color: white; text-align: center; font-size: 1rem; outline: none; }
        .btn-primary { background: #ce9e48; color: #1a1a1a; width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        
        #payment-section { display: none; margin-top: 20px; border-top: 2px dashed #444; padding-top: 20px; text-align: center; }
        
        /* تصميم الباركود المستدعى كصورة */
        .qr-image { width: 180px; height: 180px; background: white; padding: 10px; border-radius: 12px; margin-bottom: 15px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        
        .iban-card { background: #111; padding: 15px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; color: #ce9e48; display: block; margin: 10px 0; border: 1px solid #444; cursor: pointer; }
        .btn-download { background: #28a745; color: white; display: none; margin-top: 15px; width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .checkbox-container { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.9rem; margin: 15px 0; color: #bbb; cursor: pointer; }
    </style>
</head>
<body>

    <h2 style="color: #ce9e48; font-family: 'Amiri', serif; margin-bottom: 10px;">HSforDesign</h2>

    <div class="selector-area">
        <div class="thumb active" onclick="changeCard('eid-garden.jpg', false, this)">
            <img src="eid-garden.jpg">
            <p style="font-size: 0.7rem; color: #ddd; margin: 5px 0;">الحديقة</p>
        </div>
        <div class="thumb" onclick="changeCard('card.jpg', true, this)">
            <img src="card.jpg">
            <p style="font-size: 0.7rem; color: #ddd; margin: 5px 0;">بالأسماء</p>
        </div>
    </div>

    <div class="container">
        <div id="card-to-export">
            <img id="main-card-img" src="eid-garden.jpg" class="bg-image">
            <div id="wm" class="watermark">HS DESIGN</div>
            <div id="display-to" class="text-overlay" style="top: 58%; font-size: 1.8rem; color:#ce9e48;"></div>
            <div id="display-from" class="text-overlay" style="top: 65%; font-size: 1.4rem; color:#ce9e48;"></div>
        </div>
    </div>

    <div class="panel">
        <div id="inputs-area" style="display: none;">
            <input type="text" id="input-to" placeholder="إلى: (اسم المستلم)" oninput="updateText()">
            <input type="text" id="input-from" placeholder="من: (اسمك)" oninput="updateText()">
        </div>
        
        <button id="main-action-btn" type="button" class="btn-primary" onclick="revealPayment()">الاستمرار للدفع</button>

        <div id="payment-section">
            <h3 style="color: #ce9e48; margin-bottom: 15px;">امسح باركود الراجحي للدفع</h3>
            
            <img src="rajhi-qr.jpg" alt="Rajhi QR" class="qr-image">
            
            <div class="iban-card" onclick="copyIBAN()">
                SA83 8000 0866 6080 1163 4427
                <div style="font-size: 0.65rem; color: #666; margin-top: 5px;">(أو اضغط هنا لنسخ الآيبان)</div>
            </div>
            
            <p style="font-weight: bold; color: #ce9e48;">المستفيد: حنان العمار</p>
            
            <label class="checkbox-container">
                <input type="checkbox" id="paidCheck" onchange="toggleDownloadBtn()"> أكدت عملية التحويل بنجاح
            </label>
            
            <button id="downloadBtn" class="btn-download" onclick="startProcess()">إرسال الإيصال وتحميل البطاقة 🚀</button>
        </div>
    </div>

    <script>
        let hasNames = false;
        const ibanNumber = "SA8380000866608011634427";

        function copyIBAN() {
            navigator.clipboard.writeText(ibanNumber);
            alert("تم نسخ الآيبان بنجاح");
        }

        function changeCard(imgSrc, needsNames, element) {
            document.getElementById('main-card-img').src = imgSrc;
            hasNames = needsNames;
            document.getElementById('inputs-area').style.display = needsNames ? 'block' : 'none';
            document.getElementById('display-to').style.display = needsNames ? 'block' : 'none';
            document.getElementById('display-from').style.display = needsNames ? 'block' : 'none';
            
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('payment-section').style.display = 'none';
            document.getElementById('main-action-btn').style.display = 'block';
        }

        function updateText() {
            document.getElementById('display-to').innerText = document.getElementById('input-to').value;
            document.getElementById('display-from').innerText = document.getElementById('input-from').value;
        }

        function revealPayment() {
            if (hasNames && (document.getElementById('input-to').value === "" || document.getElementById('input-from').value === "")) {
                alert("لطفاً اكتب الأسماء أولاً"); return;
            }
            document.getElementById('payment-section').style.display = 'block';
            document.getElementById('main-action-btn').style.display = 'none';
        }

        function toggleDownloadBtn() {
            document.getElementById('downloadBtn').style.display = document.getElementById('paidCheck').checked ? 'block' : 'none';
        }

        function startProcess() {
            alert("سيتم نقلك للبوت لإرسال صورة الإيصال. يرجى العودة للتحميل.");
            window.open(`https://t.me/HSfordesign_bot`, '_blank');
            
            let wm = document.getElementById('wm');
            wm.style.display = 'none'; // إخفاء العلامة المائية للتحميل

            setTimeout(() => {
                html2canvas(document.querySelector("#card-to-export"), {useCORS: true, scale: 3}).then(canvas => {
                    let link = document.createElement('a');
                    link.download = 'HS-Design-Card.jpg';
                    link.href = canvas.toDataURL("image/jpeg");
                    link.click();
                    
                    wm.style.display = 'block'; // إعادة العلامة المائية
                    alert("تم التحميل بنجاح ✅");
                });
            }, 1000);
        }
    </script>
</body>
</html>
