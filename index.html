<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HS Design | بطاقة الأسماء</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-color: #bfa36a; /* اللون الذهبي المطفي الموحد */
            --dark-bg: #121212;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--dark-bg);
            font-family: 'Amiri', serif;
        }

        .card-wrapper {
            position: relative;
            width: 350px; /* مقاس مناسب للجوال */
            height: 600px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 15px;
        }

        /* صورة الخلفية الفخمة */
        .background-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* طبقة النصوص */
        .content-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .names-container {
            margin-top: 100px; /* تعديل المكان ليناسب الفراغ في التصميم */
            text-align: right;
            width: 80%;
        }

        .name-row {
            margin: 15px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        /* تسميات "إلى" و "من" */
        .label {
            color: var(--gold-color);
            font-size: 22px;
            font-weight: bold;
            margin-left: 10px;
        }

        /* الأسماء المدخلة - تم توحيد لونها هنا */
        .user-name {
            color: var(--gold-color); /* اللون الذهبي الموحد */
            font-size: 28px;
            font-weight: bold;
            border-bottom: 1px solid rgba(191, 163, 106, 0.3);
            min-width: 120px;
            text-align: center;
        }

        /* العلامة المائية لحماية الفيديو */
        .watermark {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-family: 'Cairo', sans-serif;
            font-size: 40px;
            color: rgba(255, 255, 255, 0.15); /* شفافة جداً */
            white-space: nowrap;
            user-select: none;
            pointer-events: none;
            z-index: 10;
            font-weight: bold;
            letter-spacing: 5px;
        }

        /* مدخلات البيانات (تختفي عند التنزيل/التصوير) */
        .controls {
            position: fixed;
            bottom: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        input {
            padding: 8px;
            border: 1px solid var(--gold-color);
            border-radius: 5px;
            font-family: 'Cairo', sans-serif;
        }

        button {
            background-color: var(--gold-color);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        @media print {
            .controls { display: none; }
            .watermark { display: none; } /* تختفي العلامة المائية عند الطباعة أو التصدير النهائي */
        }
    </style>
</head>
<body>

    <div class="card-wrapper" id="capture">
        <img src="your-background-image.jpg" class="background-image" alt="Background">
        
        <div class="watermark">HS DESIGN</div>

        <div class="content-overlay">
            <div class="names-container">
                <div class="name-row">
                    <span class="label">إلى:</span>
                    <span id="toOutput" class="user-name">هـلا</span>
                </div>
                <div class="name-row">
                    <span class="label">من:</span>
                    <span id="fromOutput" class="user-name">نـورة</span>
                </div>
            </div>
        </div>
    </div>

    <div class="controls">
        <input type="text" id="toInput" placeholder="اسم المستلم" oninput="updateNames()">
        <input type="text" id="fromInput" placeholder="اسم المرسل" oninput="updateNames()">
        <button onclick="downloadCard()">حفظ الصورة</button>
    </div>

    <script>
        function updateNames() {
            document.getElementById('toOutput').innerText = document.getElementById('toInput').value || 'هـلا';
            document.getElementById('fromOutput').innerText = document.getElementById('fromInput').value || 'نـورة';
        }

        function downloadCard() {
            // هنا تضعين كود مكتبة html2canvas اللي استخدمناها سابقاً
            // لتمكينك من تحميل الصورة "الصافية" لعميلك
            alert("سيتم تحميل البطاقة الصافية الآن...");
        }
    </script>
</body>
</html>
